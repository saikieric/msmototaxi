<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="msmototaxi">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>msmototaxi</title>
  <link rel="manifest" href="manifest.json">

  <!--
    Google Maps JavaScript API (used by google_maps_flutter on web).
    Replace YOUR_GOOGLE_MAPS_API_KEY_HERE with a real key from Google Cloud
    Console (APIs & Services > Credentials, "Maps JavaScript API" enabled).
    This file is static HTML, so — unlike .env / local.properties — the key
    here IS committed to git; use a key restricted to your web origin(s).

    Google Maps JavaScript API（webでgoogle_maps_flutterが使用）。
    YOUR_GOOGLE_MAPS_API_KEY_HERE を Google Cloud Console
    （APIとサービス > 認証情報、"Maps JavaScript API"を有効化）で取得した
    実際のキーに置き換える。このファイルは静的HTMLのため、.env /
    local.properties と違いキーがgit管理対象になる。Webオリジン制限を
    かけたキーを使うこと。
  -->
  <script src="https://maps.googleapis.com/maps/api/js?key=YOUR_GOOGLE_MAPS_API_KEY_HERE"></script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
